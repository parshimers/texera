server:
  applicationContextPath: /
  applicationConnectors:
    - type: http
      # Overridable because a Slurm computing unit shares its node with other computing
      # units, so the port cannot be fixed; the batch script picks a free one and passes it
      # in. Defaults to 8085, which is what every other deployment uses.
      port: ${COMPUTING_UNIT_MASTER_PORT:-8085}
      # Bound to all interfaces by default, as every deployment before this one was.
      # A per-user deployment sets it to loopback: the only thing that should reach a
      # user's services is their own gateway, and on a shared node "all interfaces"
      # means every other user on that node.
      bindHost: ${TEXERA_BIND_ADDRESS:-0.0.0.0}

  # Disable the admin connectors if you don't need an admin interface
  adminConnectors: []

  # Optional: Minimize the request log configuration if not handling HTTP requests
  requestLog:
    type: classic
    timeZone: UTC
    appenders: []

logging:
  level: ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
  loggers:
    "io.dropwizard": ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
  appenders:
    - type: console
      logFormat: "[%date{ISO8601}] [%level] [%logger] [%thread] - %msg %n"
    - type: file
      currentLogFilename: logs/computing-unit-master.log
      threshold: ALL
      queueSize: 512
      discardingThreshold: 0
      archive: false
      timeZone: UTC
      logFormat: "[%date{ISO8601}] [%level] [%logger] [%thread] - %msg %n"
      bufferSize: 8KiB
      immediateFlush: true
