server:
  applicationConnectors:
    - type: http
      # Overridable so several instances of the stack can run side by side on one
      # host -- a per-user JupyterLab deployment gives each user their own set of
      # services, so no port can be fixed. Defaults to the value every other
      # deployment uses.
      port: ${NOTEBOOK_MIGRATION_SERVICE_PORT:-9098}
      # Bound to all interfaces by default, as every deployment before this one was.
      # A per-user deployment sets it to loopback: the only thing that should reach a
      # user's services is their own gateway, and on a shared node "all interfaces"
      # means every other user on that node.
      bindHost: ${TEXERA_BIND_ADDRESS:-0.0.0.0}
  adminConnectors: []
  requestLog:
    type: classic
    appenders: []

logging:
  level: ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
  appenders:
    - type: console
      threshold: ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
    - type: file
      currentLogFilename: logs/notebook-migration-service.log
      archive: true
      archivedLogFilenamePattern: logs/notebook-migration-service-%d.log.gz
      archivedFileCount: 5