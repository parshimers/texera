computing-unit {
  # local computing unit configuration
  local {
    enabled = true
    enabled = ${?COMPUTING_UNIT_LOCAL_ENABLED}
  }
  # Computing units allocated as Slurm jobs, submitted through slurmrestd's unix socket.
  slurm {
    enabled = false
    enabled = ${?COMPUTING_UNIT_SLURM_ENABLED}

    socket-path = "/var/run/slurmrestd/slurmrestd.socket"
    socket-path = ${?COMPUTING_UNIT_SLURM_SOCKET_PATH}

    # The data_parser version in slurmrestd's URLs. It must be one the slurmrestd build serves.
    api-version = "v0.0.42"
    api-version = ${?COMPUTING_UNIT_SLURM_API_VERSION}

    # The body of POST /slurm/<api-version>/job/submit, written by the administrator. Every
    # unit is submitted from it; the manager only adds to job.environment and names the job.
    job-json = ""
    job-json = ${?COMPUTING_UNIT_SLURM_JOB_JSON}

    # How the gateway reaches a unit once it runs, with {node} replaced by the Slurm node.
    unit-address-template = "{node}:8085"
    unit-address-template = ${?COMPUTING_UNIT_SLURM_UNIT_ADDRESS_TEMPLATE}

    request-timeout-seconds = 30
    request-timeout-seconds = ${?COMPUTING_UNIT_SLURM_REQUEST_TIMEOUT_SECONDS}
  }

  # TODO: move the kubernetes configuration to here

  # whether sharing computing unit is allowed or not
  sharing {
    enabled = false
    enabled = ${?COMPUTING_UNIT_SHARING_ENABLED}
  }
}