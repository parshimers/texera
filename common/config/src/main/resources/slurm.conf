# Configuration for computing units that run as Slurm batch jobs.
#
# A Slurm computing unit is a `computing-unit-master` process launched by sbatch on a
# compute node. Unlike a Kubernetes pod, its address is not known at submission time --
# the batch script records `<node>:<port>` into <state-dir>/<cuid>/uri once the job
# starts, and the managing service copies that into workflow_computing_unit.uri, which is
# what the gateway routes on.
slurm {

  enabled = false
  enabled = ${?COMPUTING_UNIT_SLURM_ENABLED}

  # Slurm partition to submit computing units to.
  partition = "standard"
  partition = ${?SLURM_COMPUTING_UNIT_PARTITION}

  # Slurm account to charge. Empty means "use the user's default account", i.e. omit
  # --account from the submission entirely.
  account = ""
  account = ${?SLURM_COMPUTING_UNIT_ACCOUNT}

  # Wall-clock limit for a computing-unit job, in sbatch --time format.
  #
  # A computing unit is not a batch job that runs and exits: it is a long-lived server the
  # browser holds a websocket to, and it must stay alive for as long as the user wants it.
  # Its lifecycle is therefore driven entirely by explicit user deletion, which cancels the
  # job. The default is the partition maximum so the limit never ends a live session;
  # reclaiming idle units is a separate concern and deliberately not handled here.
  time-limit = "14-00:00:00"
  time-limit = ${?SLURM_COMPUTING_UNIT_TIME_LIMIT}

  # Host or IP that a compute node should use to reach the services running on the head
  # node. The computing unit inherits endpoints (JDBC, S3, lakeFS, Iceberg REST, file
  # service) that are written as "localhost" for a single-machine deployment; on a compute
  # node localhost is the wrong machine, so every occurrence is rewritten to this value.
  # It must therefore be an address the compute nodes can actually reach, and the head
  # node's services must be listening on it.
  advertise-host = "127.0.0.1"
  advertise-host = ${?SLURM_COMPUTING_UNIT_ADVERTISE_HOST}

  # Directory holding per-computing-unit job state: the generated batch script, the
  # recorded uri, and the job's stdout/stderr. Must be on a filesystem shared between the
  # head node and the compute nodes, since the job writes the uri that the managing
  # service reads back.
  state-dir = "/tmp/texera-slurm-computing-units"
  state-dir = ${?SLURM_COMPUTING_UNIT_STATE_DIR}

  # Texera source/build root. The batch script cd's here before launching, because
  # ComputingUnitMaster locates its config file relative to the working directory
  # (Utils.amberHomePath resolves "." and then looks for an "amber" directory).
  texera-home = "."
  texera-home = ${?SLURM_COMPUTING_UNIT_TEXERA_HOME}

  # Launcher for the computing unit, relative to texera-home.
  launcher = "amber/target/amber-1.3.0-incubating-SNAPSHOT/bin/computing-unit-master"
  launcher = ${?SLURM_COMPUTING_UNIT_LAUNCHER}

  # Names of environment variables to copy from the managing service's own environment
  # into the job. The endpoint variables a computing unit needs are passed explicitly by
  # the managing service; this covers the ambient toolchain settings a compute node needs
  # in order to run the same build (JDK location, the Python interpreter used for UDFs).
  env-passthrough = "JAVA_HOME,UDF_PYTHON_PATH"
  env-passthrough = ${?SLURM_COMPUTING_UNIT_ENV_PASSTHROUGH}

  # Prepended to PATH inside the job, so the launcher finds java and the UDF interpreter.
  path-prefix = ""
  path-prefix = ${?SLURM_COMPUTING_UNIT_PATH_PREFIX}

  # Fraction of a unit's requested memory to give the JVM heap (-Xmx).
  #
  # This is not optional the way it is under Kubernetes. Slurm enforces memory with a cgroup
  # and no swap, so a JVM that sizes its heap from the node's physical RAM -- which is what it
  # does by default, because the allocation is far smaller than the machine -- will grow past
  # the allocation and have the whole job killed by the cgroup. That is an abrupt death with no
  # Java OutOfMemoryError and no useful message, so the bound has to be set explicitly.
  #
  # Well under 1.0 on purpose: the heap is only part of a unit's footprint. Metaspace, thread
  # stacks, direct buffers and any Python UDF subprocesses all live in the same cgroup and are
  # counted against the same limit.
  jvm-heap-fraction = 0.5
  jvm-heap-fraction = ${?SLURM_COMPUTING_UNIT_JVM_HEAP_FRACTION}

  # Resource options offered in the UI. Unlike the Kubernetes options these are whole
  # nodes' worth of capacity, so the sensible values depend on the cluster.
  computing-unit-cpu-limit-options = "1,2,4,8,16"
  computing-unit-cpu-limit-options = ${?SLURM_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "2Gi,4Gi,8Gi,16Gi,32Gi"
  computing-unit-memory-limit-options = ${?SLURM_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # GPU support is off by default: requesting a GRES that no node registers leaves the job
  # pending forever, which is worse than not offering the option. Widen this only once
  # `sinfo -o %G` shows gpu resources on some node.
  computing-unit-gpu-limit-options = "0"
  computing-unit-gpu-limit-options = ${?SLURM_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}

  # GRES name used for GPUs in --gres=<name>:<count>.
  computing-unit-gpu-resource-name = "gpu"
  computing-unit-gpu-resource-name = ${?SLURM_COMPUTING_UNIT_GPU_RESOURCE_NAME}

  max-num-of-running-computing-units-per-user = 10
  max-num-of-running-computing-units-per-user = ${?SLURM_MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  # Slurm client binaries. Absolute paths may be given if they are not on PATH.
  sbatch = "sbatch"
  sbatch = ${?SLURM_SBATCH_PATH}
  squeue = "squeue"
  squeue = ${?SLURM_SQUEUE_PATH}
  scancel = "scancel"
  scancel = ${?SLURM_SCANCEL_PATH}
}
